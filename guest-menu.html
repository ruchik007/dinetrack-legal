<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wok &amp; Tawa House</title>
  <meta name="theme-color" content="#c45c26" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Wok &amp; Tawa House" />
  <link rel="manifest" href="./guest-menu-manifest.json" />
  <style>
    :root {
      --bg: #1a1208;
      --card: #2a1c10;
      --ink: #f6ead9;
      --muted: #c9b8a4;
      --accent: #c45c26;
      --veg: #3d9a5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      padding: 20px 16px 8px;
      position: sticky;
      top: 0;
      background: linear-gradient(#1a1208, #1a1208ee);
    }
    h1 { margin: 0; font-size: 1.45rem; letter-spacing: 0.02em; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    main { padding: 8px 16px 120px; }
    .cat { margin: 22px 0 8px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); }
    .item {
      display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
      background: var(--card); border-radius: 14px; padding: 12px 14px; margin: 8px 0;
    }
    .item img.dish {
      width: 72px; height: 72px; object-fit: cover; border-radius: 10px; flex-shrink: 0;
      background: #1a1208;
    }
    .name { font-weight: 600; }
    .desc { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .price { white-space: nowrap; font-weight: 600; }
    .veg { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--veg); margin-right: 6px; }
    button.add {
      margin-top: 8px; border: 0; border-radius: 999px; padding: 6px 12px;
      background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
    }
    #err { color: #ffb4a2; padding: 16px; }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #120c06; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      display: none; align-items: center; justify-content: space-between; gap: 12px;
    }
    .bar.show { display: flex; }
    .place {
      border: 0; background: var(--accent); color: #fff; font-weight: 700;
      border-radius: 999px; padding: 12px 18px; cursor: pointer;
    }
    dialog { border: 0; border-radius: 16px; background: var(--card); color: var(--ink); width: min(420px, 92vw); }
    dialog input, dialog textarea {
      width: 100%; margin: 8px 0; padding: 10px; border-radius: 10px; border: 1px solid #4a3726;
      background: #1a1208; color: var(--ink);
    }
    .ok { text-align: center; padding: 48px 16px; }
  </style>
</head>
<body>
  <header>
    <h1 id="shop">Wok &amp; Tawa House</h1>
    <p class="sub">Guest menu · add this page to your home screen for a shop app</p>
  </header>
  <main id="menu"></main>
  <p id="err" hidden></p>
  <div class="bar" id="bar">
    <div id="cartSummary"></div>
    <button class="place" type="button" id="checkout">Place order</button>
  </div>
  <dialog id="dlg">
    <form method="dialog" id="form">
      <h3>Your details</h3>
      <label>Name</label>
      <input id="guestName" name="name" required maxlength="40" placeholder="Your name" autocomplete="name" />
      <label>Mobile number</label>
      <input id="guestPhone" name="phone" required inputmode="tel" maxlength="13" placeholder="10-digit mobile" autocomplete="tel" />
      <label>Table (optional)</label>
      <input id="table" name="table" placeholder="Table number or name" />
      <label>Note</label>
      <textarea id="note" rows="2" maxlength="240" placeholder="Spice, no onion…"></textarea>
      <p class="sub">We use your name and number only to confirm this order at the counter.</p>
      <p id="dlgErr" style="color:#ffb4a2"></p>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button value="cancel" type="submit">Cancel</button>
        <button class="place" id="send" type="button">Send to kitchen</button>
      </div>
    </form>
  </dialog>
  <script>
    const SUPABASE_URL = 'https://fmodtemraklissrsvsye.supabase.co';
    const ANON = 'sb_publishable__Hm9sg-fOtCky1XM625FSg_HKlxJnrR';
    const params = new URLSearchParams(location.search);
    const slug = (params.get('slug') || 'wok-and-tawa-house').toLowerCase();
    const cart = new Map();
    const sid = (n) => 'bbbbbbbb-0000-4000-8000-' + String(n).padStart(12, '0');
    const FALLBACK_MENU = {
      name: 'Wok & Tawa House',
      slug: 'wok-and-tawa-house',
      categories: [
        { name: 'Tawa Pav Bhaji', items: [
          { id: sid(201), name: 'Pav Bhaji (Regular)', price: 80, description: 'Served with 2 butter pav & salad', is_veg: true },
          { id: sid(202), name: 'Butter Pav Bhaji', price: 100, description: '', is_veg: true },
          { id: sid(203), name: 'Cheese Pav Bhaji', price: 120, description: '', is_veg: true },
          { id: sid(204), name: 'Lasaniya Pav Bhaji (Garlic)', price: 120, description: '', is_veg: true },
          { id: sid(205), name: 'Paneer Pav Bhaji', price: 130, description: '', is_veg: true },
          { id: sid(206), name: 'Extra Pav', price: 10, description: '', is_veg: true },
        ]},
        { name: 'Tawa Pulao', items: [
          { id: sid(207), name: 'Veg Tawa Pulao', price: 100, description: 'Mumbai street-style spiced rice', is_veg: true },
          { id: sid(208), name: 'Butter Tawa Pulao', price: 120, description: '', is_veg: true },
          { id: sid(209), name: 'Cheese Tawa Pulao', price: 130, description: '', is_veg: true },
          { id: sid(210), name: 'Paneer Tawa Pulao', price: 150, description: '', is_veg: true },
        ]},
        { name: 'Warm Soups', items: [
          { id: sid(211), name: 'Hot & Sour Soup', price: 80, description: 'With crisp fried noodles', is_veg: true },
          { id: sid(212), name: 'Manchow Soup', price: 80, description: '', is_veg: true },
          { id: sid(213), name: 'Manchurian Soup', price: 90, description: '', is_veg: true },
          { id: sid(214), name: 'Noodles Soup', price: 80, description: '', is_veg: true },
          { id: sid(215), name: 'Garlic Soup', price: 90, description: '', is_veg: true },
        ]},
        { name: 'Gravy Specials', items: [
          { id: sid(216), name: 'Manchurian Gravy', price: 120, description: 'Pair with fried rice / noodles', is_veg: true },
          { id: sid(217), name: 'Paneer Chilli Gravy', price: 200, description: '', is_veg: true },
          { id: sid(218), name: 'Gravy with Rice', price: 130, description: '', is_veg: true },
          { id: sid(219), name: 'Chowmein Gravy', price: 130, description: '', is_veg: true },
          { id: sid(220), name: 'American Chop Suey', price: 150, description: '', is_veg: true },
        ]},
        { name: 'Crispy Starters', items: [
          { id: sid(221), name: 'Manchurian Dry', price: 120, description: 'Wok tossed dry & crunchy', is_veg: true },
          { id: sid(222), name: 'Paneer Chilli Dry', price: 200, description: '', is_veg: true },
          { id: sid(223), name: 'Mushroom Chilli', price: 150, description: '', is_veg: true },
          { id: sid(224), name: 'Paneer 65', price: 230, description: '', is_veg: true },
          { id: sid(225), name: 'Veg 65', price: 140, description: '', is_veg: true },
          { id: sid(226), name: 'Singapore Manchurian', price: 130, description: '', is_veg: true },
          { id: sid(227), name: 'Cheese Chilli', price: 180, description: '', is_veg: true },
          { id: sid(228), name: 'Bombay Bhel', price: 130, description: '', is_veg: true },
          { id: sid(229), name: 'Chinese Bhel', price: 130, description: '', is_veg: true },
        ]},
        { name: 'Wok Tossed Noodles', items: [
          { id: sid(230), name: 'Hakka Noodles', price: 110, description: 'High flame street style', is_veg: true },
          { id: sid(231), name: 'Manchurian Noodles', price: 120, description: '', is_veg: true },
          { id: sid(232), name: 'Schezwan Noodles', price: 120, description: '', is_veg: true },
          { id: sid(233), name: 'Garlic Noodles', price: 140, description: '', is_veg: true },
          { id: sid(234), name: 'Mushroom Noodles', price: 140, description: '', is_veg: true },
          { id: sid(235), name: 'Paneer Noodles', price: 150, description: '', is_veg: true },
          { id: sid(236), name: 'Hong Kong Noodles', price: 140, description: '', is_veg: true },
          { id: sid(237), name: 'Singapore Noodles', price: 130, description: '', is_veg: true },
        ]},
        { name: 'Fried Rice', items: [
          { id: sid(238), name: 'Veg Fried Rice', price: 110, description: 'Aromatic long grain wok rice', is_veg: true },
          { id: sid(239), name: 'Manchurian Rice', price: 120, description: '', is_veg: true },
          { id: sid(240), name: 'Schezwan Rice', price: 120, description: '', is_veg: true },
          { id: sid(241), name: 'Garlic Rice', price: 140, description: '', is_veg: true },
          { id: sid(242), name: 'Mushroom Rice', price: 140, description: '', is_veg: true },
          { id: sid(243), name: 'Paneer Rice', price: 150, description: '', is_veg: true },
          { id: sid(244), name: 'Hong Kong Rice', price: 130, description: '', is_veg: true },
          { id: sid(245), name: 'Singapore Rice', price: 130, description: '', is_veg: true },
          { id: sid(246), name: 'Combination Rice (Rice + Noodles)', price: 140, description: '', is_veg: true },
        ]},
      ],
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./guest-menu-sw.js').catch(() => {});
    }

    function money(n) {
      return '₹' + Number(n).toFixed(0);
    }

    async function rpc(name, body) {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: {
          apikey: ANON,
          Authorization: 'Bearer ' + ANON,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = text; }
      if (!res.ok) {
        const msg = (data && (data.message || data.hint || data.error)) || text || 'Request failed';
        throw new Error(msg);
      }
      return data;
    }

    function renderCart() {
      let qty = 0, total = 0;
      cart.forEach((line) => { qty += line.qty; total += line.qty * line.price; });
      const bar = document.getElementById('bar');
      if (!qty) { bar.classList.remove('show'); return; }
      bar.classList.add('show');
      document.getElementById('cartSummary').textContent = qty + ' item' + (qty === 1 ? '' : 's') + ' · ' + money(total);
    }

    function addItem(item) {
      const cur = cart.get(item.id) || { ...item, qty: 0 };
      cur.qty = Math.min(20, cur.qty + 1);
      cart.set(item.id, cur);
      renderCart();
    }

    function render(menu) {
      document.getElementById('shop').textContent = menu.name || 'Wok & Tawa House';
      const root = document.getElementById('menu');
      root.innerHTML = '';
      (menu.categories || []).forEach((cat) => {
        if (!cat.items || !cat.items.length) return;
        const h = document.createElement('div');
        h.className = 'cat';
        h.textContent = cat.name;
        root.appendChild(h);
        cat.items.forEach((item) => {
          const el = document.createElement('div');
          el.className = 'item';
          const src = dishPhoto(item.name);
          el.innerHTML =
            '<img class="dish" alt="" src="' + src + '" />' +
            '<div style="flex:1"><div class="name">' + (item.is_veg ? '<span class="veg"></span>' : '') +
            escapeHtml(item.name) + '</div>' +
            (item.description ? '<div class="desc">' + escapeHtml(item.description) + '</div>' : '') +
            '<button class="add" type="button">Add</button></div>' +
            '<div class="price">' + money(item.price) + '</div>';
          el.querySelector('button').addEventListener('click', () => addItem(item));
          root.appendChild(el);
        });
      });
    }

    function dishPhoto(name) {
      const photos = {
        'pav bhaji (regular)': 'pav_bhaji_regular.jpg',
        'butter pav bhaji': 'butter_pav_bhaji.jpg',
        'cheese pav bhaji': 'cheese_pav_bhaji.jpg',
        'lasaniya pav bhaji (garlic)': 'lasaniya_pav_bhaji.jpg',
        'paneer pav bhaji': 'paneer_pav_bhaji.jpg',
        'extra pav': 'extra_pav.jpg',
        'veg tawa pulao': 'veg_tawa_pulao.jpg',
        'butter tawa pulao': 'butter_tawa_pulao.jpg',
        'cheese tawa pulao': 'cheese_tawa_pulao.jpg',
        'paneer tawa pulao': 'paneer_tawa_pulao.jpg',
        'hot & sour soup': 'hot_sour_soup.jpg',
        'manchow soup': 'manchow_soup.jpg',
        'manchurian soup': 'manchurian_soup.jpg',
        'noodles soup': 'noodles_soup.jpg',
        'garlic soup': 'garlic_soup.jpg',
        'manchurian gravy': 'manchurian_gravy.jpg',
        'paneer chilli gravy': 'paneer_chilli_gravy.jpg',
        'gravy with rice': 'gravy_with_rice.jpg',
        'chowmein gravy': 'chowmein_gravy.jpg',
        'american chop suey': 'american_chop_suey.jpg',
        'manchurian dry': 'manchurian_dry.jpg',
        'paneer chilli dry': 'paneer_chilli_dry.jpg',
        'mushroom chilli': 'mushroom_chilli.jpg',
        'paneer 65': 'paneer_65.jpg',
        'veg 65': 'veg_65.jpg',
        'singapore manchurian': 'singapore_manchurian.jpg',
        'cheese chilli': 'cheese_chilli.jpg',
        'bombay bhel': 'bombay_bhel.jpg',
        'chinese bhel': 'chinese_bhel.jpg',
        'hakka noodles': 'hakka_noodles.jpg',
        'manchurian noodles': 'manchurian_noodles.jpg',
        'schezwan noodles': 'schezwan_noodles.jpg',
        'garlic noodles': 'garlic_noodles.jpg',
        'mushroom noodles': 'mushroom_noodles.jpg',
        'paneer noodles': 'paneer_noodles.jpg',
        'hong kong noodles': 'hong_kong_noodles.jpg',
        'singapore noodles': 'singapore_noodles.jpg',
        'veg fried rice': 'veg_fried_rice.jpg',
        'manchurian rice': 'manchurian_rice.jpg',
        'schezwan rice': 'schezwan_rice.jpg',
        'garlic rice': 'garlic_rice.jpg',
        'mushroom rice': 'mushroom_rice.jpg',
        'paneer rice': 'paneer_rice.jpg',
        'hong kong rice': 'hong_kong_rice.jpg',
        'singapore rice': 'singapore_rice.jpg',
        'combination rice (rice + noodles)': 'combination_rice.jpg',
      };
      const file = photos[String(name || '').trim().toLowerCase()] || 'veg_fried_rice.jpg';
      return './menu/' + file;
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    document.getElementById('checkout').addEventListener('click', () => {
      document.getElementById('dlgErr').textContent = '';
      const tableParam = params.get('table');
      if (tableParam) document.getElementById('table').value = tableParam;
      document.getElementById('dlg').showModal();
    });

    document.getElementById('send').addEventListener('click', async () => {
      const err = document.getElementById('dlgErr');
      err.textContent = '';
      const name = document.getElementById('guestName').value.trim();
      const phone = document.getElementById('guestPhone').value.replace(/\D/g, '');
      if (name.length < 2) { err.textContent = 'Enter your name'; return; }
      if (phone.length < 10) { err.textContent = 'Enter a valid mobile number'; return; }
      const items = [];
      cart.forEach((line) => items.push({ id: line.id, qty: line.qty }));
      try {
        const out = await rpc('guest_submit_order', {
          p_slug: slug,
          p_table: document.getElementById('table').value || null,
          p_items: items,
          p_note: document.getElementById('note').value || null,
          p_guest_name: name,
          p_guest_phone: phone,
        });
        document.getElementById('dlg').close();
        document.querySelector('main').innerHTML =
          '<div class="ok"><h2>Order ' + escapeHtml(out.order_number) + '</h2><p>Thanks, ' + escapeHtml(name) + '. We have your order. Pay at the counter.</p></div>';
        document.getElementById('bar').classList.remove('show');
        cart.clear();
      } catch (e) {
        err.textContent = e.message || String(e);
      }
    });

    rpc('public_guest_menu', { p_slug: slug })
      .then((menu) => {
        const cats = (menu && menu.categories) || [];
        const hasItems = cats.some((c) => c.items && c.items.length);
        if (hasItems) render(menu);
        else render(FALLBACK_MENU);
      })
      .catch(() => render(FALLBACK_MENU));
  </script>
</body>
</html>
